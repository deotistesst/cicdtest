name: Deploy Project Business
on:
  push:
    branches:
    - vars_test
    paths:
      - 'business/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout release
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: AWS configure credentials
      uses: aws-actions/configure-aws-credentials@v4 
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
    
    - name: Grant execute permitssion for scripts
      run: chmod +x business/scripts/*.sh  
        
    - name: Upload to AWS S3
      run: |
        aws deploy push \
          --application-name ${{ secrets.CODE_DEPLOY_APPLICATION_NAME }} \
          --s3-location s3://${{ secrets.AWS_S3_BUCKET_NAME }}/BUSINESS-$GITHUB_SHA.zip \
          --ignore-hidden-files \
          --source business
          --ignore-application-stop-failures
      
    - name: Deploy to AWS EC2 from S3
      run: |
        aws deploy create-deployment \
          --application-name ${{ secrets.CODE_DEPLOY_APPLICATION_NAME }} \
          --deployment-config-name CodeDeployDefault.OneAtATime \
          --deployment-group-name ${{ secrets.CODE_DEPLOY_DEPLOYMENT_BUSINESS }}\
          --s3-location bucket=${{ secrets.AWS_S3_BUCKET_NAME }},key=BUSINESS-$GITHUB_SHA.zip,bundleType=zip