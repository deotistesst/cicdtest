version: 0.0
os: linux
files:
  - source: /
    destination: /home/ec2-user/business
  - source: scripts/
    destination: /home/ec2-user/business/scripts
hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 60
      runas: root
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 60
      runas: root