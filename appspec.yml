version: 0.0
os: linux
files:
  - source: /
    destination: /home/ec2-user
hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 60
      runas: root
  ApplicationStart:
    - location: scripts/start_home.sh
      timeout: 60
      runas: root
    - location: scripts/start_mobile.sh
      timeout: 60
      runas: root